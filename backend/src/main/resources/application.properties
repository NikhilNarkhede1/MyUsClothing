# ---------------- Database ----------------
# H2 stores everything in the folder backend/data. Nothing to install.
# spring.datasource.url=jdbc:h2:file:./data/shopdb
# spring.datasource.username=sa
# spring.datasource.password=




spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# Hibernate creates / updates the tables for us
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------- Server ----------------
server.port=8080
server.error.include-message=always

# ---------------- Email ----------------
# Fill MAIL_USERNAME and MAIL_PASSWORD (see README, step "Turn on emails").
# If MAIL_USERNAME is empty, the app does NOT send mail: it prints the email in the console instead.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------- Shop settings ----------------
app.store.name=MyUsClothing
# Orders of this amount or more get free shipping
app.shipping.free-above=1499
app.shipping.fee=99
